##### My customization - Start #####
ota:
  platform: esphome
  password: !secret ota_password

api:
  encryption:
    key: !secret api_encryption

# Uncomment to keep the clock on the right time zone (Home Assistant also provides it)
# time:
#   - id: !extend time_provider
#     timezone: Europe/Berlin

number:
  - id: !remove temperature_correction
  ##### Temperature Correction #####
  - id: temperature_correction
    name: DHT Temperature Correction
    platform: template
    entity_category: config
    unit_of_measurement: °C
    min_value: -10
    max_value: 10
    initial_value: -3
    step: 0.1
    mode: box
    restore_value: true
    internal: false
    optimistic: true
    on_value:
      - logger.log: Temperature correction changed.
      - delay: 1s
      - lambda: |-
          #if ESPHOME_VERSION_CODE >= VERSION_CODE(2026, 3, 99)
          temp_nspanel->publish_state(temp_nspanel->get_raw_state());
          #else
          temp_nspanel->publish_state(temp_nspanel->raw_state);
          #endif

sensor:
  - id: !remove temp_nspanel
  - platform: dht
    model: DHT22
    pin: 23
    temperature:
      name: DHT22 Temperature
      id: temp_nspanel
      filters:
        - lambda: |-
            return x + temperature_correction->state;
      on_value:
        then:
          # Show panel's temperature if API or Wi-Fi are out
          - lambda: display_embedded_temp->execute();
    humidity:
      name: DHT22 Humidity
      id: humidity_nspanel
      accuracy_decimals: 1
    update_interval: 5s

climate:
  - id: !extend thermostat_embedded
    humidity_sensor: humidity_nspanel
    # The core already has a "Home" preset (heat, target_low) - set target_low above instead
    # of adding a second "Home" preset here.
##### My customization - End #####

packages:
