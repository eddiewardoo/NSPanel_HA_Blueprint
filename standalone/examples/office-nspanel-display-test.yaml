#####################################################################################################
##### Office Display (test bench) - NSPanel HA Blueprint in STANDALONE mode                     #####
##### All settings live in this file. The blueprint automation is NOT needed (disable it).      #####
##### Guide: https://github.com/eddiewardoo/NSPanel_HA_Blueprint/blob/claude/keen-pasteur-hjcvae/standalone/README.md
#####################################################################################################

substitutions:
  ##### Device #####
  device_name: "office-nspanel-display-test"
  friendly_name: "Office Display"
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  nextion_update_url: "http://homeassistant.local:8123/local/TFT/nspanel_eu.tft"

  ##### Climate add-on (embedded thermostat) #####
  heater_relay: "1"         # Relay 1 drives the heater
  temp_min: "15"
  temp_max: "30"
  target_low: "21"          # Target temperature of the built-in "Home" preset
  heat_deadband: "0.5"      # Temperature delta before engaging heat
  heat_overrun: "0.1"       # Temperature delta before disengaging heat
  # min_off_time: "300"
  # min_run_time: "300"
  # min_idle_time: "30"

  ##### QR code (core) #####
  # qrcode_title_initial_value: "Wi-Fi"
  # qrcode_initial_value: "WIFI:S:MySSID;T:WPA;P:MyPassword;;"   # Also set qrcode_enabled: "true"

  #####################################################################################################
  ##### Standalone settings (former blueprint inputs)                                             #####
  ##### Uncommented lines are what this panel uses; commented lines show the default value.       #####
  ##### Colors are "R, G, B". Icons are MDI code points in DOUBLE quotes, e.g. "\uE6E8".          #####
