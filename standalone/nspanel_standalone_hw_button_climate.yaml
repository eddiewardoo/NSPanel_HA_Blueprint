#####################################################################################################
##### NSPANEL STANDALONE - Hardware button for the embedded thermostat (climate add-on)         #####
#####                                                                                           #####
##### Works fully offline. Same as the blueprint: a press (short or long) opens the climate     #####
##### page; the bar lights up while the thermostat is not OFF.                                  #####
#####                                                                                           #####
##### vars:                                                                                     #####
#####   side:         left | right                                                              #####
#####   press_action: page (default, open the climate page) | toggle (switch on_mode <-> OFF)   #####
#####   on_mode:      HEAT | COOL | HEAT_COOL | AUTO (default HEAT, used by press_action: toggle) #####
#####################################################################################################
---
defaults:
  press_action: page
  on_mode: HEAT

script:
  - id: !extend standalone_apply_settings
    then:
      - lambda: |-
          action_component_val->execute("mem", "button_${side}", 1);
          sa_hw_button_${side}_climate_refresh->execute();

  - id: !extend button_${side}_press_short
    then:
      - script.execute: sa_hw_button_${side}_climate_press

  - id: !extend button_${side}_press_long
    then:
      - script.execute: sa_hw_button_${side}_climate_press

  - id: sa_hw_button_${side}_climate_press
    mode: single
    then:
      - lambda: |-
          if ("${press_action}" == std::string("toggle")) {
            auto call = thermostat_embedded->make_call();
            call.set_mode(thermostat_embedded->mode == climate::CLIMATE_MODE_OFF
                            ? climate::CLIMATE_MODE_${on_mode}
                            : climate::CLIMATE_MODE_OFF);
            call.perform();
            sa_hw_button_${side}_climate_refresh->execute();
            return;
          }
          // Open the embedded climate page (same as tapping the indoor temperature)
          if (current_page_id == ${PAGE_CLIMATE_ID}) return;
          detailed_entity->publish_state("embedded_climate");
          disp1->set_component_value("climate.embedded", 1);
          goto_page->execute(${PAGE_CLIMATE_ID});

  # The climate add-on runs page_home on every thermostat change
  - id: !extend page_home
    then:
      - lambda: sa_hw_button_${side}_climate_refresh->execute();

  - id: sa_hw_button_${side}_climate_refresh
    mode: restart
    then:
      - lambda: |-
          const bool on = thermostat_embedded->mode != climate::CLIMATE_MODE_OFF;
          if ("${side}" == std::string("left")) {
            id(hardware_settings).button_left_state = on;
            refresh_hardware_buttons_bars->execute(1);
          } else {
            id(hardware_settings).button_right_state = on;
            refresh_hardware_buttons_bars->execute(2);
          }
...
